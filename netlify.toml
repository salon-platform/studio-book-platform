[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# v6.2 wildcard pretty URLs: route the root path through the subdomain
# router. <name>.salonvine.com/ -> /site.html (salon read from the
# hostname); reserved hosts + apex pass through to the marketing site.
[[edge_functions]]
  path = "/"
  function = "salon-subdomain"

# V2 pretty URLs used by the homepage CTAs (?salon=/?plan= query
# strings pass through automatically on 200 rewrites).
[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Pretty client URLs: <name>.salonvine.com serves that salon's site.
# site.html reads the slug from the hostname (subdomainSlug) and the
# backend matches it hyphen-insensitively, so no query string is
# needed. force=true because index.html exists at "/" and would
# otherwise shadow the rewrite. One rule per named salon until the
# wildcard-DNS project lands.
[[redirects]]
  from = "https://calicuts.salonvine.com/"
  to = "/site.html"
  status = 200
  force = true

# Instant salon sites: /s/<slug> served by the universal renderer.
# status=200 = rewrite; :splat carries the slug. MUST stay above the catch-all.
[[redirects]]
  from = "/s/*"
  to = "/site.html?s=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
